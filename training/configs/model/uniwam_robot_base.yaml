# UniWAM full model. Paper settings and release defaults are distinguished in ROBOT.md.
model_id: Wan-AI/Wan2.2-TI2V-5B
tokenizer_model_id: Wan-AI/Wan2.2-TI2V-5B
tokenizer_max_len: 128
load_text_encoder: false
redirect_common_files: false
mot_checkpoint_mixed_attn: true
action_dit_pretrained_path: null
skip_dit_load_from_pretrain: false
video_dit_config:
  has_image_input: false
  patch_size:
  - 1
  - 2
  - 2
  in_dim: 48
  hidden_dim: 3072
  ffn_dim: 14336
  freq_dim: 256
  text_dim: 4096
  out_dim: 48
  num_heads: 24
  attn_head_dim: 128
  num_layers: 30
  eps: 1.0e-06
  seperated_timestep: true
  require_clip_embedding: false
  require_vae_embedding: false
  fuse_vae_embedding_in_latents: true
  use_gradient_checkpointing: true
  video_attention_mask_mode: first_frame_causal
  action_conditioned: false
  action_dim: 9
  action_group_causal_mask_mode: group_diagonal
action_dit_config:
  hidden_dim: 1024
  ffn_dim: 4096
  num_heads: 24
  attn_head_dim: 128
  num_layers: 30
  text_dim: 4096
  freq_dim: 256
  eps: 1.0e-06
  use_gradient_checkpointing: true
  manip_action_dim: 26
  nav_action_dim: 9
  manip_horizon: 32
  nav_horizon: 32
  type_token_count: 4
proprio_dim: 20
view_type_token_count: 4
prefix_probability: 0.5
prefix_min: 1
prefix_max: 8
